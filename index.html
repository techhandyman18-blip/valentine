<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Muskaan — Will you be my Valentine? 💘</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6f0, #e6f0ff);
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .card{
      background:white;
      border-radius:20px;
      padding:26px;
      width:min(520px,92vw);
      box-shadow:0 10px 30px rgba(0,0,0,.15);
      text-align:center;
      position:relative;
    }
    img{
      width:220px;
      max-width:70vw;
    }
    .buttons{
      position:relative;
      height:90px;
    }
    button{
      padding:12px 20px;
      border-radius:14px;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }
    #yes{
      background:#16a34a;
      color:white;
    }
    #no{
      background:#ef4444;
      color:white;
      position:absolute;
      left:55%;
      top:20px;
    }
    .yay{
      font-size:48px;
      color:pink;
      font-weight:900;
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="module">
import React, {useRef,useState} from "https://esm.sh/react@18.2.0";
import {createRoot} from "https://esm.sh/react-dom@18.2.0/client";

const NO_PHRASES=[
"No 💔",
"Pretty please? 🥺",
"But we'd be so cute together 💕",
"One more chance?",
"Don't break my heart :(",
"What about a maybe?",
"I'm fragile 😭"
];

function App(){
  const [noClicks,setNo]=useState(0);
  const [yes,setYes]=useState(false);
  const noRef=useRef(null);

  const firstImg="https://media.tenor.com/VIChDQ6ejRQAAAAj/jumping-bear-hearts-no-png.gif";
  const secondImg="https://media.tenor.com/f1xnRxTRxLAAAAAj/bears-with-kisses-bg.gif";

  const yesSize=Math.min(60,18+noClicks*4);

  function moveNo(){
    const b=noRef.current;
    const x=Math.random()*(window.innerWidth-b.offsetWidth);
    const y=Math.random()*(window.innerHeight-b.offsetHeight);
    b.style.left=x+"px";
    b.style.top=y+"px";
  }

  return React.createElement("div",{className:"card"},
    !yes ?
    <>
      <img src={firstImg}/>
      <h1>Muskaan, will you be my Valentine? 💘</h1>

      <div className="buttons">
        <button id="yes"
          style={{fontSize:yesSize+"px"}}
          onClick={()=>setYes(true)}>Yes 💚</button>

        <button id="no"
          ref={noRef}
          onMouseEnter={moveNo}
          onClick={()=>{setNo(v=>v+1);moveNo();}}>
          {noClicks===0?"No":NO_PHRASES[Math.min(noClicks-1,NO_PHRASES.length-1)]}
        </button>
      </div>
    </>
    :
    <>
      <img src={secondImg}/>
      <div className="yay">Yay!!! 💖🎉</div>
      <p>You’re officially my Valentine 😘</p>
    </>
  );
}

createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
